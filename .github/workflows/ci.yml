name: Build, test, release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check formatting and compiler warnings
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Build standalone binary
        run: cargo build --release --locked
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v' + tomllib.load(open('Cargo.toml','rb'))['package']['version']"
      - name: Package and test extracted portable app without runtime tools in PATH
        run: python packaging/package.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish tested ZIPs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --verify-tag \
            --title "doc-search-lite $GITHUB_REF_NAME" \
            --notes "Portable, offline Chinese/English BM25 search for DOCX, XLSX, PPTX and text PDFs. No Python, Node, models, or database server. Extract the ZIP and run; put the folder in ~/.agents/skills/ to use it as a Skill. Windows x64 and macOS arm64/x64 archives are tested after extraction by GitHub Actions. Binaries are unsigned. See the README for usage and format limits."

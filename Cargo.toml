[package]
name = "doc-search-lite"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small, offline document search for AI agent skills"
repository = "https://github.com/yongyaoduan/doc-search-lite"

[dependencies]
anyhow = "1"
calamine = "0.36"
clap = { version = "4", features = ["derive"] }
pdf-extract = "0.12"
quick-xml = "0.41"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde_json = "1"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

